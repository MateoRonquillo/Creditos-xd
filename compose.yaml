name: simulador-creditos

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  environment: &dotnet-environment
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ASPNETCORE_URLS: http://+:8080
    Jwt__Issuer: ${JWT_ISSUER:-SimuladorCreditos.AuthService}
    Jwt__Audience: ${JWT_AUDIENCE:-SimuladorCreditos.Client}
    Jwt__Key: ${JWT_KEY:-CAMBIAR_ESTA_CLAVE_JWT_LOCAL_DE_AL_MENOS_32_CARACTERES}
  networks:
    - backend

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edge

  api-gateway:
    <<: *dotnet-service
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *dotnet-environment
      Services__Auth: http://auth-service:8080
      Services__Credits: http://credit-service:8080
      Services__Simulations: http://simulation-service:8080
      Services__Documents: http://document-service:8080
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      auth-service:
        condition: service_started
      credit-service:
        condition: service_started
      simulation-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - edge
      - backend

  auth-service:
    <<: *dotnet-service
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
    environment:
      <<: *dotnet-environment
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${SQL_SA_PASSWORD:-CreditoLocal_2026!};Encrypt=True;TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
      - data

  credit-service:
    <<: *dotnet-service
    build:
      context: ./backend/CreditService
      dockerfile: Dockerfile
    environment:
      <<: *dotnet-environment
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CreditDb;User Id=sa;Password=${SQL_SA_PASSWORD:-CreditoLocal_2026!};Encrypt=True;TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
      - data

  simulation-service:
    <<: *dotnet-service
    build:
      context: ./backend/SimulationService
      dockerfile: Dockerfile
    environment:
      <<: *dotnet-environment
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=SimulationDb;User Id=sa;Password=${SQL_SA_PASSWORD:-CreditoLocal_2026!};Encrypt=True;TrustServerCertificate=True
      Services__Credits: http://credit-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      credit-service:
        condition: service_started
    networks:
      - backend
      - data

  document-service:
    <<: *dotnet-service
    build:
      context: ./backend/DocumentService
      dockerfile: Dockerfile
    environment:
      <<: *dotnet-environment
      Services__Simulations: http://simulation-service:8080
    depends_on:
      simulation-service:
        condition: service_started
    networks:
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-CreditoLocal_2026!}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

volumes:
  sqlserver-data:
    name: simulador-creditos-sqlserver-data

networks:
  edge:
    name: simulador-creditos-edge
  backend:
    name: simulador-creditos-backend
    internal: true
  data:
    name: simulador-creditos-data
    internal: true
